name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: check, test, build, boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --component rust-src,clippy
          rustup default nightly
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Clippy, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build the kernel
        run: >
          cargo -Zbuild-std=core,compiler_builtins,alloc
          -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec
          build -p zpl-kernel-bin
          --target crates/zpl-kernel/x86_64-zpl-kernel.json --release

      - name: ELF gate
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          llvm-objdump -f target/x86_64-zpl-kernel/release/zpl-kernel-bin

      - name: Install QEMU
        run: sudo apt-get install -y qemu-system-x86

      - name: Boot it, and check what it said
        run: bash scripts/ci-boot-check.sh boot.log

      - name: Build the kernel with the command line
        run: >
          cargo -Zbuild-std=core,compiler_builtins,alloc
          -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec
          build -p zpl-kernel-bin --features shell --target-dir target/shell
          --target crates/zpl-kernel/x86_64-zpl-kernel.json --release

      - name: Type on the prompt, over PS/2 and over USB
        run: bash scripts/usb-kbd-test.sh

      - name: Keep the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: boot.log
          if-no-files-found: warn

      - name: Keep the keyboard test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-kbd-test-logs
          path: target/usb-kbd-test/*.log
          if-no-files-found: warn
